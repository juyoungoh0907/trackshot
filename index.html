<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrackShot</title>
<meta name="description" content="240fps 슬로모션 투구 영상으로 구속을 재고 궤적 영상을 만드는 웹앱">
<meta name="theme-color" content="#101312">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TrackShot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f6f7f6; --surface:#ffffff; --ink:#151a17; --muted:#6b736e; --line:#e2e6e3;
  --green:#1f9d55; --green-soft:#e6f4ec; --stage:#0d0f0e; --warn:#8a5a00; --warn-bg:#fdf3dd;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101312; --surface:#171b19; --ink:#e9ece9; --muted:#8d968f; --line:#262c29;
  --green:#3ccf7a; --green-soft:#16261d; --stage:#000; --warn:#f2c46b; --warn-bg:#2b2310; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
button,select,input,label{-webkit-tap-highlight-color:transparent}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.02em}
h1 span{color:var(--green)}
header p{margin:0;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:880px){.grid{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:24px}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}

.vf{background:var(--stage);border-radius:12px;display:flex;justify-content:center;overflow:hidden}
.stage{position:relative}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas{touch-action:none;cursor:crosshair}

button,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:8px 12px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,.btn:focus-within,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (hover:hover){button:hover:not(:disabled),.btn:hover{border-color:var(--muted)}}
button:active:not(:disabled){transform:scale(.97)}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
select,input[type=number]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:46px}

.scrub{display:flex;align-items:center;gap:10px}
.scrub input[type=range]{flex:1;min-width:0;accent-color:var(--green);height:32px}
.time{font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ctrl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ctrl button{font-family:var(--f-num);font-size:15px;padding:6px 2px}
.ctrl .play{font-family:var(--f-body);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .btn{flex:1}
.row select{width:auto;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.hint{margin:0;font-size:14px}
.hint b{color:var(--green);font-weight:600;margin-right:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:999px;flex:none;overflow:hidden;background:var(--surface)}
.chip.on{border-color:var(--green);background:var(--green-soft)}
.chip button{border:none;border-radius:0;min-height:38px;background:transparent;font-size:13px;padding:4px 6px 4px 12px}
.chip button.x{padding:4px 12px 4px 6px;color:var(--muted);font-size:16px}
.chip b{font-weight:600;margin-right:4px}
.empty{font-size:13px;color:var(--muted);padding:9px 0}
.pt-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pt-actions button{font-size:14px;min-height:42px}

.speed{display:flex;align-items:baseline;gap:6px}
.speed .v{font-family:var(--f-num);font-size:56px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.speed .v.idle{color:var(--line)}
.speed .u{font-size:15px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:10px}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta b{font-family:var(--f-num);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:99px;padding:2px 8px;margin-left:6px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 11px;font-size:13px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:42px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted);text-align:center;line-height:1.2;padding:2px}
.seg input:checked+span{border-color:var(--ink);color:var(--ink);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.status{font-size:13px;color:var(--muted);margin:0}
.status.ok{color:var(--green)}
.result{display:flex;flex-direction:column;gap:8px}
.result video{width:100%;max-height:60vh;border-radius:10px;background:#000;display:block}
.result .row button{flex:1}

details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;min-height:28px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--muted);font-size:20px}
details[open] summary::after{content:"−"}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--muted);margin:0}
footer{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Track<span>Shot</span></h1><p>슬로모션 투구 영상으로 구속 측정</p></header>

  <div class="grid">
    <div class="col">
      <div class="vf" id="vf">
        <div class="stage" id="stage">
          <video id="video" playsinline muted preload="auto"></video>
          <canvas id="cv" aria-label="영상 화면. 정지 상태에서 공을 누르면 점이 찍히고, 누른 채로 움직이면 위치를 조정합니다."></canvas>
        </div>
      </div>
      <div class="scrub">
        <input type="range" id="scrub" min="0" max="0" value="0" step="1" aria-label="프레임 이동" disabled>
        <span class="time" id="readout">F0<br>0.000s</span>
      </div>
      <div class="ctrl">
        <button id="b10" disabled aria-label="10프레임 뒤로">−10</button>
        <button id="b1" disabled aria-label="1프레임 뒤로">−1</button>
        <button class="play" id="play" disabled>재생</button>
        <button id="f1" disabled aria-label="1프레임 앞으로">+1</button>
        <button id="f10" disabled aria-label="10프레임 앞으로">+10</button>
      </div>
      <div class="row">
        <label class="btn primary">영상 불러오기<input type="file" id="file" accept="video/*"></label>
        <select id="rate" aria-label="재생 속도">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
        </select>
      </div>
      <div class="warn" id="vidErr" hidden></div>

      <div class="card">
        <p class="hint" id="now"></p>
        <div class="chips" id="chips"></div>
        <div class="pt-actions">
          <button id="delHere" disabled>이 프레임 점 지우기</button>
          <button id="clear" disabled>점 모두 지우기</button>
        </div>
        <p class="note">화면을 누른 채로 움직이면 확대경을 보며 점 위치를 맞출 수 있습니다. 같은 프레임을 다시 누르면 점이 옮겨집니다.</p>
      </div>
    </div>

    <div class="col">
      <div class="card" aria-live="polite">
        <div class="label">구속<span class="tag" id="tag" hidden>예시</span></div>
        <div class="speed"><span class="v" id="kmh">61.2</span><span class="u">km/h</span></div>
        <div class="meta">
          <div><span class="label">비행시간</span><b id="flight">0.529s</b></div>
          <div><span class="label">프레임</span><b id="frames">127</b></div>
          <div><span class="label">오차</span><b id="err">±0.5</b></div>
        </div>
        <div class="warn" id="speedWarn" hidden></div>
        <div class="seg" id="types"></div>
        <label class="f">저장 영상 속도
          <select id="exMode">
            <option value="rt">실제 속도</option>
            <option value="both">실제 속도 + 슬로모션 리플레이</option>
            <option value="slow">슬로모션</option>
          </select>
        </label>
        <button class="primary" id="export" disabled>영상 저장</button>
        <p class="status" id="exStatus" hidden></p>
        <div class="result" id="result" hidden>
          <video id="resultVideo" controls playsinline muted></video>
          <div class="row">
            <button id="dl">파일로 저장</button>
            <button id="share" hidden>공유 · 사진에 저장</button>
          </div>
        </div>
      </div>

      <details class="card" id="setBox">
        <summary>측정 설정</summary>
        <div class="fields">
          <label class="f">투구 거리 (m)<input type="number" inputmode="decimal" id="dist" step="0.1" min="1" max="25" value="10"></label>
          <label class="f">릴리스 앞당김 (m)<input type="number" inputmode="decimal" id="ext" step="0.1" min="0" max="2.5" value="1.0"></label>
          <label class="f">촬영 fps<select id="fps"><option>240</option><option>120</option><option>60</option></select></label>
          <label class="f">영상 파일 형식<select id="slow"><option value="1">원본 고속 파일</option><option value="8">8배 느리게 저장됨</option><option value="4">4배 느리게 저장됨</option></select></label>
          <label class="f">투구 손<select id="hand"><option value="R">우투</option><option value="L">좌투</option></select></label>
        </div>
        <p class="note" id="effNote"></p>
        <p class="note">+1을 여러 번 눌러야 화면이 한 번 움직이면 '8배 느리게 저장됨'을 고르세요. 폰은 투수 뒤 대각선 2~3m에 고정하는 것을 권장합니다.</p>
      </details>
    </div>
  </div>
  <footer>TrackShot</footer>
</div>
<script src="vendor/mp4-muxer.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const video=$('#video'), cv=$('#cv'), ctx=cv.getContext('2d'), stage=$('#stage'), vf=$('#vf');
const TYPES=['패스트볼','커브','슬라이더','체인지업','기타'];
const EN={'패스트볼':'Fastball','커브':'Curveball','슬라이더':'Slider','체인지업':'Changeup','기타':''};
const GREEN='#3ccf7a';
const KEY='trackshot-v1';
const S={points:[],fps:240,slow:1,dist:10,ext:1.0,hand:'R',exMode:'rt',hasVideo:false,ar:16/9,exporting:false};
try{const raw=localStorage.getItem(KEY)||localStorage.getItem('pitch-tracer-v1'); if(raw){const d=JSON.parse(raw); Object.assign(S,{fps:d.fps||240,slow:d.slow||1,dist:d.dist||10,ext:(d.ext??1.0),hand:d.hand||'R',exMode:d.exMode||'rt'});}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({fps:S.fps,slow:S.slow,dist:S.dist,ext:S.ext,hand:S.hand,exMode:S.exMode}))}catch(e){}}

$('#types').innerHTML=TYPES.map((n,i)=>`<label><input type="radio" name="ptype" id="pt${i}" value="${n}" ${i===0?'checked':''}><span>${n}</span></label>`).join('');
const curType=()=>document.querySelector('input[name=ptype]:checked').value;
$('#fps').value=String(S.fps); $('#slow').value=String(S.slow); $('#dist').value=S.dist; $('#ext').value=S.ext; $('#hand').value=S.hand; $('#exMode').value=S.exMode;

const step=()=>S.slow/S.fps;
const eff=()=>Math.max(0.3,S.dist-S.ext);

function layout(){
  const W=vf.clientWidth, maxH=Math.max(240,window.innerHeight*(window.innerWidth<880?0.58:0.68));
  const h=Math.min(W/S.ar,maxH), w=h*S.ar;
  stage.style.width=w+'px'; stage.style.height=h+'px';
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
}
window.addEventListener('resize',layout);

/* ---------- 계산 ---------- */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let k=i+1;k<n;k++)if(Math.abs(A[k][i])>Math.abs(A[m][i]))m=k;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];if(Math.abs(A[i][i])<1e-12)return null;for(let k=i+1;k<n;k++){const f=A[k][i]/A[i][i];for(let j=i;j<n;j++)A[k][j]-=f*A[i][j];b[k]-=f*b[i];}}const x=new Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i];}return x;}
function polyfit(us,vs,deg){const n=deg+1,A=[...Array(n)].map(()=>new Array(n).fill(0)),b=new Array(n).fill(0);for(let k=0;k<us.length;k++){const p=[];for(let i=0;i<n;i++)p.push(Math.pow(us[k],i));for(let i=0;i<n;i++){b[i]+=p[i]*vs[k];for(let j=0;j<n;j++)A[i][j]+=p[i]*p[j];}}return solve(A,b);}
function fitCurve(pts){
  const t0=pts[0].t,tN=pts[pts.length-1].t,span=tN-t0||1;
  const us=pts.map(p=>(p.t-t0)/span), deg=pts.length>=3?2:1;
  const cx=polyfit(us,pts.map(p=>p.x),deg), cy=polyfit(us,pts.map(p=>p.y),deg);
  if(!cx||!cy){const a=pts[0],z=pts[pts.length-1];return u=>({x:a.x+(z.x-a.x)*u,y:a.y+(z.y-a.y)*u});}
  return u=>({x:cx.reduce((s,c,i)=>s+c*Math.pow(u,i),0),y:cy.reduce((s,c,i)=>s+c*Math.pow(u,i),0)});
}
function speedInfo(){
  const P=S.points; if(P.length<2)return null;
  const dv=P[P.length-1].t-P[0].t; if(dv<=0)return null;
  const dt=dv/S.slow, v=eff()/dt*3.6, frames=Math.round(dv/step());
  return {v,dt,frames,err:frames>0?v-eff()/(dt+1/S.fps)*3.6:0};
}

/* ---------- 궤적·라벨 ---------- */
function drawLine(c,curve,uEnd,W,H,o={}){
  const sc=Math.min(W,H)/500*1.6, n=Math.max(2,Math.ceil(80*uEnd));
  c.save(); c.lineCap='round'; c.lineJoin='round';
  c.strokeStyle=GREEN; c.globalAlpha=o.faint?.35:1; c.lineWidth=(o.faint?2:3.5)*sc;
  c.beginPath(); let p=curve(0); c.moveTo(p.x*W,p.y*H);
  for(let i=1;i<=n;i++){p=curve(uEnd*i/n);c.lineTo(p.x*W,p.y*H);}
  c.stroke();
  if(!o.faint){c.fillStyle=GREEN;c.beginPath();c.arc(p.x*W,p.y*H,4.5*sc,0,Math.PI*2);c.fill();}
  c.restore();
}
function rrect(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function drawLabel(c,x,y,v,type,W,H,alpha=1){
  const sc=Math.min(W,H)/500*1.6, F='"IBM Plex Sans KR",system-ui,sans-serif';
  const en=(EN[type]||'').toUpperCase(), num=v.toFixed(1);
  c.save(); c.globalAlpha=alpha; c.textBaseline='alphabetic';
  const sp=n=>{try{c.letterSpacing=n+'px';}catch(e){}};
  c.font=`600 ${30*sc}px ${F}`; sp(-.5*sc); const nw=c.measureText(num).width;
  c.font=`500 ${11*sc}px ${F}`; sp(.6*sc); const uw=c.measureText('km/h').width;
  c.font=`600 ${9.5*sc}px ${F}`; sp(1.8*sc); const ew=en?c.measureText(en).width:0;
  const px=13*sc, gap=5*sc, top=en?20*sc:10*sc;
  const bw=Math.max(nw+gap+uw,ew)+px*2, bh=top+32*sc;
  const ex=x*W, ey=y*H;
  let bx=ex+26*sc, by=ey-bh-26*sc;
  if(bx+bw>W-8) bx=ex-26*sc-bw;
  bx=Math.min(Math.max(8,bx),W-bw-8); by=Math.min(Math.max(8,by),H-bh-8);
  // 연결선
  const ax=bx>ex?bx:bx+bw, ay=by+bh;
  c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=1*sc;
  c.beginPath(); c.moveTo(ex,ey); c.lineTo(ax,ay); c.stroke();
  // 카드
  c.fillStyle='rgba(12,14,13,.68)'; rrect(c,bx,by,bw,bh,9*sc); c.fill();
  c.strokeStyle='rgba(255,255,255,.12)'; c.lineWidth=1; rrect(c,bx+.5,by+.5,bw-1,bh-1,9*sc); c.stroke();
  if(en){c.font=`600 ${9.5*sc}px ${F}`; sp(1.8*sc); c.fillStyle=GREEN; c.fillText(en,bx+px,by+17*sc);}
  c.font=`600 ${30*sc}px ${F}`; sp(-.5*sc); c.fillStyle='#fff'; c.fillText(num,bx+px,by+bh-11*sc);
  c.font=`500 ${11*sc}px ${F}`; sp(.6*sc); c.fillStyle='rgba(255,255,255,.62)'; c.fillText('km/h',bx+px+nw+gap,by+bh-12*sc);
  c.restore();
}

/* ---------- 워터마크 ---------- */
function drawWatermark(c,W,H){
  const s=Math.min(W,H), m=s*0.035, fs=Math.max(10,s*0.03);
  c.save(); c.textBaseline='alphabetic'; c.shadowColor='rgba(0,0,0,.55)'; c.shadowBlur=fs*0.4;
  c.font=`400 ${fs}px "IBM Plex Sans KR",system-ui,sans-serif`;
  c.fillStyle='rgba(255,255,255,.78)';
  const a='Tracked by ', aw=c.measureText(a).width;
  c.fillText(a,m,H-m);
  c.font=`700 ${fs}px "IBM Plex Sans KR",system-ui,sans-serif`;
  c.fillStyle='#fff'; c.fillText('TrackShot',m+aw,H-m);
  c.restore();
}

/* ---------- 회전 3D 애니메이션 ---------- */
// 투수 뒤에서 본 시점: x=오른쪽, y=위, z=타깃 방향. 우투 기준 팔 쪽 = +x.
const SPIN={
  '패스트볼':{fx:.35,fy:1,gz:0,rps:1.6},
  '커브':{fx:-.45,fy:-1,gz:0,rps:1.3},
  '슬라이더':{fx:-1,fy:-.15,gz:1.4,rps:1.8},
  '체인지업':{fx:.75,fy:.5,gz:0,rps:.9}
};
const SEAM=(()=>{const a=.7,b=.3,k=2*Math.sqrt(a*b),out=[];const N=220;
  const ax=.7,ay=.45,cx=Math.cos(ax),sx=Math.sin(ax),cy=Math.cos(ay),sy=Math.sin(ay);
  for(let i=0;i<N;i++){const t=i/N*Math.PI*2;let x=a*Math.cos(t)+b*Math.cos(3*t),y=a*Math.sin(t)-b*Math.sin(3*t),z=k*Math.sin(2*t);
    let y1=y*cx-z*sx,z1=y*sx+z*cx; let x2=x*cy+z1*sy,z2=-x*sy+z1*cy; out.push([x2,y1,z2]);}
  return out;})();
function rot(v,k,cs,sn){const d=k[0]*v[0]+k[1]*v[1]+k[2]*v[2];
  return [v[0]*cs+(k[1]*v[2]-k[2]*v[1])*sn+k[0]*d*(1-cs), v[1]*cs+(k[2]*v[0]-k[0]*v[2])*sn+k[1]*d*(1-cs), v[2]*cs+(k[0]*v[1]-k[1]*v[0])*sn+k[2]*d*(1-cs)];}
function drawSpin(c,W,H,type,hand,time){
  const sp=SPIN[type]; if(!sp)return;
  const mir=hand==='L'?-1:1, fx=sp.fx*mir, fy=sp.fy, gz=sp.gz*mir;
  let w=[-fy,fx,gz]; const wl=Math.hypot(...w); w=w.map(v=>v/wl);
  const s=Math.min(W,H), R=s*0.07, m=s*0.035;
  const pw=R*4.2, ph=R*4.15, px=W-m-pw, py=H-m-ph, cx=px+pw/2, cy=py+R*1.8;
  c.save();
  c.fillStyle='rgba(8,10,9,.55)'; rrect(c,px,py,pw,ph,R*.3); c.fill();
  // 공
  const g=c.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);
  g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#ece7dc');g.addColorStop(1,'#b9b2a3');
  c.fillStyle=g; c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.fill();
  // 실밥
  const th=time*sp.rps*Math.PI*2, cs=Math.cos(th), sn=Math.sin(th);
  const P=SEAM.map(p=>rot(p,w,cs,sn)), N=P.length;
  c.lineCap='round';
  for(let i=0;i<N;i++){
    const p=P[i], q=P[(i+1)%N]; if(p[2]>0&&q[2]>0)continue;
    const al=Math.min(1,Math.max(0,-(p[2]+q[2])/2*3));
    c.strokeStyle=`rgba(190,30,45,${al})`; c.lineWidth=R*.035;
    c.beginPath(); c.moveTo(cx+p[0]*R,cy-p[1]*R); c.lineTo(cx+q[0]*R,cy-q[1]*R); c.stroke();
    if(i%4===0&&p[2]<0){
      const t=[q[0]-p[0],q[1]-p[1],q[2]-p[2]];
      let d=[t[1]*p[2]-t[2]*p[1],t[2]*p[0]-t[0]*p[2],t[0]*p[1]-t[1]*p[0]]; const dl=Math.hypot(...d)||1; d=d.map(v=>v/dl*.08);
      c.lineWidth=R*.03;
      c.beginPath(); c.moveTo(cx+(p[0]-d[0])*R,cy-(p[1]-d[1])*R); c.lineTo(cx+(p[0]+d[0]+t[0]*1.2)*R,cy-(p[1]+d[1]+t[1]*1.2)*R); c.stroke();
    }
  }
  // 회전축
  c.setLineDash([R*.12,R*.1]); c.strokeStyle='rgba(255,255,255,.75)'; c.lineWidth=R*.04;
  c.beginPath(); c.moveTo(cx-w[0]*R*1.4,cy+w[1]*R*1.4); c.lineTo(cx+w[0]*R*1.4,cy-w[1]*R*1.4); c.stroke(); c.setLineDash([]);
  // 무브먼트 방향 화살표
  const ml=Math.hypot(fx,fy), dx=fx/ml, dy=-fy/ml;
  const x1=cx+dx*R*1.12, y1=cy+dy*R*1.12, x2=cx+dx*R*1.62, y2=cy+dy*R*1.62, hs=R*.2;
  c.strokeStyle=GREEN; c.fillStyle=GREEN; c.lineWidth=R*.07;
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2-dx*hs*.6,y2-dy*hs*.6); c.stroke();
  c.beginPath(); c.moveTo(x2,y2); c.lineTo(x2-dx*hs-dy*hs*.7,y2-dy*hs+dx*hs*.7); c.lineTo(x2-dx*hs+dy*hs*.7,y2-dy*hs-dx*hs*.7); c.closePath(); c.fill();
  // 글자
  c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='#fff'; c.font=`700 ${R*.34}px "IBM Plex Sans KR",system-ui,sans-serif`;
  c.fillText(`${type} · ${EN[type]}`,cx,py+R*3.68,pw-R*.3);
  c.restore();
}

function drawOverlays(c,W,H,t,paused,clock){
  const P=S.points;
  if(P.length>=2){
    const curve=fitCurve(P), t0=P[0].t, tN=P[P.length-1].t, uNow=(t-t0)/(tN-t0||1);
    if(uNow>0) drawLine(c,curve,Math.min(1,uNow),W,H);
    else if(paused&&!S.exporting) drawLine(c,curve,1,W,H,{faint:true});
    if(uNow>=1){const info=speedInfo(); if(info){const e=curve(1), a=Math.min(1,(t-tN)/(0.04*S.slow)+.15); drawLabel(c,e.x,e.y,info.v,curType(),W,H,a);}}
  }
  drawWatermark(c,W,H);
  drawSpin(c,W,H,curType(),S.hand,clock);
}
function drawDemo(c,W,H){
  const T=(performance.now()/1000)%3;
  c.fillStyle='#1a1d1c';c.fillRect(0,0,W,H);
  c.fillStyle='#232725';c.fillRect(0,H*.66,W,H*.34);
  c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1.5;c.strokeRect(W*.47,H*.36,W*.1,H*.2);
  const curve=u=>({x:.30+.22*u-.03*u*u,y:.40-.06*u+.13*u*u});
  const u=T<.5?0:T<2?(T-.5)/1.5:1;
  if(u>0)drawLine(c,curve,u,W,H);
  else{const p=curve(0);c.fillStyle='#fff';c.beginPath();c.arc(p.x*W,p.y*H,4,0,7);c.fill();}
  if(u>=1){const e=curve(1);drawLabel(c,e.x,e.y,61.2,curType(),W,H,Math.min(1,(T-2)/.25));}
  const sc=Math.min(W,H)/500*1.6;
  c.fillStyle='rgba(255,255,255,.55)';c.font=`400 ${Math.round(13*sc)}px "IBM Plex Sans KR",sans-serif`;c.textBaseline='top';
  c.fillText('예시 화면 · 눌러서 영상 불러오기',14*sc,12*sc);
  drawWatermark(c,W,H);
  drawSpin(c,W,H,curType(),S.hand,performance.now()/1000);

let downloads=null;
if(window.claude&&claude.use) claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function seekTo(t){return new Promise(res=>{const h=()=>{video.removeEventListener('seeked',h);res();};video.addEventListener('seeked',h);video.currentTime=t;});}
function pickMime(){
  if(!window.MediaRecorder)return null;
  for(const m of ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'])
    if(MediaRecorder.isTypeSupported(m))return m;

}
function drawSlowTag(c,W,H){
  const s=Math.min(W,H), m=s*0.035, fs=Math.max(10,s*0.026);
  c.save(); c.font=`600 ${fs}px "IBM Plex Sans KR",system-ui,sans-serif`; try{c.letterSpacing=(fs*.18)+'px';}catch(e){}
  c.textBaseline='top'; c.shadowColor='rgba(0,0,0,.55)'; c.shadowBlur=fs*.4;
  c.fillStyle=GREEN; c.beginPath(); c.arc(m+fs*.35,m+fs*.55,fs*.28,0,Math.PI*2); c.fill();
  c.fillStyle='#fff'; c.fillText('SLOW MOTION',m+fs*1.1,m);

function status(msg,ok){const s=$('#exStatus');s.hidden=!msg;s.textContent=msg||'';s.classList.toggle('ok',!!ok);}
async function exportVideo(){
  const P=S.points, info=speedInfo(); if(!info||S.exporting)return;
  const mime=pickMime(); const oc=document.createElement('canvas');
  if(mime===null||!oc.captureStream){status('이 브라우저는 영상 저장을 지원하지 않습니다. 크롬이나 사파리 최신 버전에서 열어 주세요.');return;}
  S.exporting=true; setBusy(true); $('#result').hidden=true;
  const long=1920, vw=video.videoWidth||1280, vh=video.videoHeight||720, k=Math.min(1,long/Math.max(vw,vh));
  oc.width=Math.round(vw*k/2)*2; oc.height=Math.round(vh*k/2)*2;
  const oc2=oc.getContext('2d');
  const t0=P[0].t, tN=P[P.length-1].t, dur=video.duration||tN;
  // 구간: 실제 속도(파일 배속만큼 빠르게 재생) / 슬로모션
  const seg=(rate,leadReal,tailReal,slow)=>({rate,slow,start:Math.max(0,t0-leadReal*S.slow),end:Math.min(dur,tN+tailReal*S.slow)});
  const segs=[];
  if(S.exMode!=='slow') segs.push(seg(S.slow,1.2,0.3,false));
  if(S.exMode!=='rt') segs.push(seg(S.slow>=4?1:0.25,0.25,0.15,true));
  const holdOf=i=>i===segs.length-1?1500:700;
  const total=segs.reduce((s,g,i)=>s+(g.end-g.start)/g.rate+holdOf(i)/1000,0);
  video.pause();
  const stream=oc.captureStream(30);
  let rec; try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6});}catch(e){rec=new MediaRecorder(stream);}
  const chunks=[]; rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  const done=new Promise(r=>rec.onstop=r);
  // vt = 저장 영상 안의 시간(회전 애니메이션 시계)
  let cur=segs[0], holding=false, stepping=false, running=true, base=0, vt=0, liveT0=performance.now(), liveVt=0, stepT=0;
  const tHold=tN+1e-3+(tN-t0);
  const renderFrame=t=>{
    oc2.drawImage(video,0,0,oc.width,oc.height);
    drawOverlays(oc2,oc.width,oc.height,t,false,vt);
    if(cur.slow&&segs.length>1)drawSlowTag(oc2,oc.width,oc.height);
  };
  const segDur=g=>(g.end-g.start)/g.rate;
  const draw=()=>{
    if(!running)return;
    if(!stepping){vt=liveVt+(performance.now()-liveT0)/1000; renderFrame(holding?tHold:video.currentTime);}
    const el=base+(stepping?stepT:holding?segDur(cur)+(performance.now()-liveT0)/1000:Math.max(0,(video.currentTime-cur.start)/cur.rate));
    status(`저장 영상 만드는 중… ${Math.min(99,Math.round(el/total*100))}%`);
    requestAnimationFrame(draw);
  };
  const goLive=()=>{liveVt=vt; liveT0=performance.now();};
  const pause=()=>{try{if(rec.state==='recording')rec.pause();}catch(e){}};
  const resume=()=>{try{if(rec.state==='paused')rec.resume();}catch(e){}};
  const nextPaint=()=>new Promise(r=>requestAnimationFrame(()=>r()));
  // 정지 상태에서 한 프레임씩 정확히 찾아가기
  const seekFrame=t=>new Promise(res=>{
    let seeked=false, shown=!video.requestVideoFrameCallback, fin=false;
    const end=()=>{if(!fin&&seeked&&shown){fin=true;res();}};
    if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(()=>{shown=true;end();});
    const h=()=>{video.removeEventListener('seeked',h);seeked=true;setTimeout(()=>{shown=true;end();},250);end();};
    video.addEventListener('seeked',h); video.currentTime=Math.min(dur,Math.max(0,t));
  });
  draw();
  for(let i=0;i<segs.length;i++){
    cur=segs[i]; holding=false;
    if(cur.rate>1){
      // 실제 속도: 재생하지 않고 1/30초 간격 프레임을 하나씩 찍어 녹화
      stepping=true; stepT=0;
      if(rec.state==='inactive'){rec.start(250);} pause();
      const dt=S.slow/30;
      for(let ft=cur.start; ft<=cur.end+1e-6; ft+=dt){
        await seekFrame(ft);
        renderFrame(ft);
        resume(); await nextPaint(); renderFrame(ft); await wait(34); pause();
        vt+=1/30; stepT+=1/30;
      }
      stepping=false; goLive(); resume();
    }else{
      if(rec.state==='inactive'){await seekTo(cur.start); goLive(); rec.start(250);}
      else{pause(); await seekTo(cur.start); goLive(); resume();}
      video.playbackRate=cur.rate;
      try{await video.play();}catch(e){}
      while(video.currentTime<cur.end&&!video.ended&&!video.paused) await wait(15);
      video.pause();
    }
    holding=true; goLive();
    await wait(holdOf(i));
    vt=liveVt+(performance.now()-liveT0)/1000;
    base+=segDur(cur)+holdOf(i)/1000;
  }
  running=false; rec.stop(); await done;
  stream.getTracks().forEach(t=>t.stop());
  video.playbackRate=+$('#rate').value;
  S.exporting=false; setBusy(false);
  const type=(rec.mimeType||mime||'video/webm'), ext=type.includes('mp4')?'mp4':'webm';
  await deliver(new Blob(chunks,{type}),ext,info);
}

/* WebCodecs: 프레임마다 정확한 시간을 지정해 인코딩. 휴대폰 성능과 무관하게 끊김 없음 */
async function exportVideoWC(){
  const P=S.points, info=speedInfo(); if(!info||S.exporting)return;
  S.exporting=true; setBusy(true); $('#result').hidden=true; status('저장 영상 준비 중…');
  try{
    const vw=video.videoWidth||1280, vh=video.videoHeight||720;
    let W=0,H=0,codec=null;
    for(const long of [1920,1280,960]){
      const k=Math.min(1,long/Math.max(vw,vh)); W=Math.round(vw*k/2)*2; H=Math.round(vh*k/2)*2;
      for(const c of ['avc1.640028','avc1.4d0028','avc1.640033','avc1.42002a','avc1.42001f']){
        try{const r=await VideoEncoder.isConfigSupported({codec:c,width:W,height:H,bitrate:8e6,framerate:30}); if(r&&r.supported){codec=c;break;}}catch(e){}
      }
      if(codec)break;
    }
    if(!codec)throw new Error('codec');
    const oc=document.createElement('canvas'); oc.width=W; oc.height=H; const c2=oc.getContext('2d');
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
    let encErr=null;
    const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{encErr=e;}});
    enc.configure({codec,width:W,height:H,bitrate:8e6,framerate:30});

    const t0=P[0].t, tN=P[P.length-1].t, dur=video.duration||tN, tHold=tN+1e-3+(tN-t0);
    const segs=[];
    const mk=(fps,play,lead,tail,slow,rateOut)=>{const start=Math.max(0,t0-lead*S.slow), end=Math.min(dur,tN+tail*S.slow), step=rateOut/fps;
      return {fps,play,slow,start,end,step,count:Math.max(1,Math.floor((end-start)/step+1e-6)+1)};};
    // 실제 속도: 60fps 출력, 파일 시간은 배속만큼 건너뜀
    if(S.exMode!=='slow') segs.push(mk(60,S.slow>=4?2:1,1.2,0.3,false,S.slow));
    // 슬로모션: 30fps 출력
    if(S.exMode!=='rt'){const r=S.slow>=4?1:0.25; segs.push(mk(30,r,0.25,0.15,true,r));}
    const holdSec=i=>i===segs.length-1?1.5:0.7;
    const totalFrames=segs.reduce((s,g,i)=>s+g.count+Math.round(holdSec(i)*30),0);
    let ts=0, n=0;
    const emit=(t,g,fps)=>{
      if(encErr)throw encErr;
      c2.drawImage(video,0,0,W,H);
      drawOverlays(c2,W,H,t,false,ts/1e6);
      if(g.slow&&segs.length>1)drawSlowTag(c2,W,H);
      const d=Math.round(1e6/fps);
      const f=new VideoFrame(oc,{timestamp:ts,duration:d});
      enc.encode(f,{keyFrame:n%60===0}); f.close();
      ts+=d; n++;
      if(n%4===0)status(`저장 영상 만드는 중… ${Math.min(99,Math.round(n/totalFrames*100))}%`);
    };
    const drain=async()=>{while(enc.encodeQueueSize>6)await wait(8);};
    for(let i=0;i<segs.length;i++){
      const g=segs[i]; let k=0;
      video.pause(); await seekTo(g.start);
      while(k<g.count&&g.start+k*g.step<=video.currentTime+1e-4){emit(g.start+k*g.step,g,g.fps);k++;await drain();}
      if(k<g.count){
        await new Promise((resolve,reject)=>{
          let fin=false, last=performance.now();
          const finish=()=>{if(fin)return;fin=true;video.pause();clearInterval(dog);resolve();};
          const dog=setInterval(()=>{if(performance.now()-last>4000)finish();},500);
          const onFrame=async(now,meta)=>{
            if(fin)return; last=performance.now();
            try{while(k<g.count&&g.start+k*g.step<=meta.mediaTime+1e-4){emit(g.start+k*g.step,g,g.fps);k++;}}
            catch(e){fin=true;clearInterval(dog);video.pause();reject(e);return;}
            if(k>=g.count||video.ended){finish();return;}
            if(enc.encodeQueueSize>6){video.pause();await drain();if(!fin)video.play().catch(()=>{});}
            video.requestVideoFrameCallback(onFrame);
          };
          video.requestVideoFrameCallback(onFrame);
          video.addEventListener('ended',finish,{once:true});
          video.playbackRate=g.play; video.play().catch(finish);
        });
        while(k<g.count){emit(g.start+k*g.step,g,g.fps);k++;await drain();}
      }
      const hf=Math.round(holdSec(i)*30);
      for(let h=0;h<hf;h++){emit(tHold,g,30);await drain();}
    }
    await enc.flush(); enc.close(); muxer.finalize();
    video.playbackRate=+$('#rate').value;
    S.exporting=false; setBusy(false);
    await deliver(new Blob([muxer.target.buffer],{type:'video/mp4'}),'mp4',info);
  }catch(e){
    video.pause(); video.playbackRate=+$('#rate').value;
    S.exporting=false; setBusy(false);
    throw e;
  }
}
const canWC=()=>!!(window.VideoEncoder&&window.VideoFrame&&window.Mp4Muxer&&HTMLVideoElement.prototype.requestVideoFrameCallback);


/* ---------- 미리보기 ---------- */
let loupe=null;
function drawLoupe(W,H){
  if(!loupe||!video.videoWidth)return;
  const dpr=window.devicePixelRatio||1, R=58*dpr, Z=3, cx=loupe.x*W, cy=loupe.y*H;
  let lx=cx, ly=cy-R-48*dpr; if(ly<R+6) ly=cy+R+48*dpr;
  lx=Math.min(Math.max(R+6,lx),W-R-6);
  const k=video.videoWidth/W, sw=2*R/Z;
  ctx.save();
  ctx.beginPath(); ctx.arc(lx,ly,R,0,Math.PI*2); ctx.closePath();
  ctx.fillStyle='#000'; ctx.fill(); ctx.clip();
  const vw=video.videoWidth,vh=video.videoHeight,ss=sw*k;
  const sx=Math.min(Math.max(0,(cx-sw/2)*k),vw-ss), sy=Math.min(Math.max(0,(cy-sw/2)*k),vh-ss);
  ctx.drawImage(video,sx,sy,ss,ss,lx-R-((cx-sw/2)*k-sx)/k*Z,ly-R-((cy-sw/2)*k-sy)/k*Z,2*R,2*R);
  ctx.strokeStyle=GREEN; ctx.lineWidth=1.5*dpr;
  ctx.beginPath(); ctx.moveTo(lx-14*dpr,ly); ctx.lineTo(lx-5*dpr,ly); ctx.moveTo(lx+5*dpr,ly); ctx.lineTo(lx+14*dpr,ly);
  ctx.moveTo(lx,ly-14*dpr); ctx.lineTo(lx,ly-5*dpr); ctx.moveTo(lx,ly+5*dpr); ctx.lineTo(lx,ly+14*dpr); ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(lx,ly,R,0,Math.PI*2); ctx.lineWidth=3*dpr; ctx.strokeStyle='#fff'; ctx.stroke();
}
function render(){
  const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
  if(!S.hasVideo){drawDemo(ctx,W,H);requestAnimationFrame(render);return;}
  const t=video.currentTime, sc=Math.min(W,H)/500*1.6;
  drawOverlays(ctx,W,H,t,video.paused,performance.now()/1000);
  if(video.paused&&!S.exporting){
    S.points.forEach((p,i)=>{const cur=Math.abs(p.t-t)<step()/2;
      ctx.beginPath();ctx.arc(p.x*W,p.y*H,(cur?10:6)*sc,0,7);ctx.lineWidth=(cur?2:1.5)*sc;ctx.strokeStyle=cur?GREEN:'rgba(255,255,255,.85)';ctx.stroke();
      if(cur){ctx.fillStyle=GREEN;ctx.font=`600 ${11*sc}px "IBM Plex Sans KR",sans-serif`;ctx.textBaseline='bottom';ctx.fillText(String(i+1),p.x*W+11*sc,p.y*H-8*sc);}
    });
    drawLoupe(W,H);
  }
  requestAnimationFrame(render);
}

/* ---------- 저장 결과 전달 ---------- */
let lastFile=null;
function stampName(info,ext){const d=new Date(),p=n=>String(n).padStart(2,'0');return `TrackShot_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}_${info.v.toFixed(1)}kmh.${ext}`;}
async function deliver(blob,ext,info){
  const filename=stampName(info,ext);
  lastFile={blob,filename,type:ext==='mp4'?'video/mp4':'video/webm'};
  const rv=$('#resultVideo'); if(rv.src)URL.revokeObjectURL(rv.src); rv.src=URL.createObjectURL(blob); $('#result').hidden=false;
  let canShare=false;
  try{canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],filename,{type:lastFile.type})]}));}catch(e){}
  $('#share').hidden=!canShare;
  status(`영상을 만들었습니다 (${(blob.size/1048576).toFixed(1)}MB). 아래 버튼으로 저장하세요.`,true);
  $('#result').scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('#dl').onclick=async()=>{
  if(!lastFile)return;
  if(downloads){
    try{await downloads.save({filename:lastFile.filename,data:lastFile.blob});status('저장했습니다.',true);}
    catch(e){status(e&&e.code==='declined'?'저장을 취소했습니다.':'이 화면에서는 파일 저장을 할 수 없습니다.');}
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(lastFile.blob); a.download=lastFile.filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  status('다운로드를 시작했습니다.',true);
};
$('#share').onclick=async()=>{
  if(!lastFile)return;
  try{await navigator.share({files:[new File([lastFile.blob],lastFile.filename,{type:lastFile.type})],title:'TrackShot'});}
  catch(e){if(e&&e.name!=='AbortError')status('공유하지 못했습니다. 파일로 저장을 이용하세요.');}
};

function setBusy(b){
  ['#play','#b10','#b1','#f1','#f10','#export','#delHere','#clear','#scrub'].forEach(s=>{if(b)$(s).disabled=true;});
  $('#file').disabled=b;
  if(!b){['#play','#b10','#b1','#f1','#f10','#scrub'].forEach(s=>$(s).disabled=!S.hasVideo);updateResult();}
}

/* ---------- 화면 갱신 ---------- */
const frameNo=t=>Math.round(t/step());
function updateReadout(){
  if(!S.hasVideo){$('#readout').innerHTML='F0<br>0.000s';return;}
  const t=video.currentTime;
  $('#readout').innerHTML=`F${frameNo(t)}<br>${(t/S.slow).toFixed(3)}s`;
  const sc=$('#scrub'); sc.max=Math.max(0,Math.floor((video.duration||0)/step())); if(document.activeElement!==sc)sc.value=frameNo(t);
  renderChips();
}
function hereIdx(){const t=video.currentTime;return S.points.findIndex(p=>Math.abs(p.t-t)<step()/2);}
function renderChips(){
  const box=$('#chips'), n=S.points.length;
  if(!S.hasVideo||n===0){box.innerHTML=`<span class="empty">${S.hasVideo?'아직 찍은 점이 없습니다.':'영상을 불러오면 여기에 점이 표시됩니다.'}</span>`;}
  else{
    const h=hereIdx();
    box.innerHTML=S.points.map((p,i)=>{const name=i===0?'릴리스':(i===n-1&&n>1?'도착':`${i+1}`);
      return `<span class="chip${i===h?' on':''}"><button data-go="${i}" aria-label="${name} 프레임으로 이동"><b>${name}</b>F${frameNo(p.t)}</button><button class="x" data-del="${i}" aria-label="${name} 점 지우기">×</button></span>`;}).join('');
  }
  $('#delHere').disabled=S.exporting||hereIdx()<0;
}
$('#chips').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'), d=e.target.closest('[data-del]');
  if(d){S.points.splice(+d.dataset.del,1);updateResult();return;}
  if(g){video.pause();video.currentTime=S.points[+g.dataset.go].t;}
});
const NOW=['공이 손을 떠나는 프레임에서 공을 누르세요.','프레임을 넘기며 공 위치를 3~6번 더 누르세요.','공이 타깃에 닿는 프레임에서 마지막으로 누르세요.','재생해서 궤적을 확인하고 영상을 저장하세요.'];
function updateResult(){
  const info=speedInfo(), w=$('#speedWarn'), n=S.points.length;
  $('#clear').disabled=n===0||S.exporting;
  $('#effNote').textContent=`공 비행거리 ${eff().toFixed(1)}m로 계산합니다.`;
  const k=$('#kmh');
  if(!S.hasVideo){
    $('#tag').hidden=false; k.classList.remove('idle'); k.textContent='61.2';
    $('#flight').textContent='0.529s';$('#frames').textContent='127';$('#err').textContent='±0.5';
    $('#export').disabled=true; w.hidden=true;
  }else if(!info){
    $('#tag').hidden=true; k.classList.add('idle'); k.textContent='00.0';
    $('#flight').textContent='–';$('#frames').textContent='–';$('#err').textContent='–';
    $('#export').disabled=true; w.hidden=true;
  }else{
    $('#tag').hidden=true; k.classList.remove('idle'); k.textContent=info.v.toFixed(1);
    $('#flight').textContent=info.dt.toFixed(3)+'s';$('#frames').textContent=info.frames;$('#err').textContent='±'+info.err.toFixed(1);
    $('#export').disabled=S.exporting;
    if(info.v<20||info.v>170){w.hidden=false;w.textContent=`${info.v.toFixed(0)} km/h는 일반 범위를 벗어납니다. 측정 설정의 '영상 파일 형식'을 확인하세요.`;}
    else if(n===2){w.hidden=false;w.textContent='중간 점을 2~4개 더 찍으면 휘는 궤적이 나옵니다.';}
    else w.hidden=true;
  }
  const s=n===0?0:n===1?1:n===2?2:3;
  $('#now').innerHTML=S.hasVideo?`<b>${Math.min(s+1,4)}/4</b>${NOW[s]}`:'<b>시작</b>240fps 슬로모션 영상을 불러오세요.';
  renderChips();
}

/* ---------- 영상 불러오기·재생 ---------- */
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;$('#vidErr').hidden=true;$('#result').hidden=true;status('');video.src=URL.createObjectURL(f);video.load();});
video.addEventListener('loadedmetadata',()=>{
  S.hasVideo=true; S.points=[]; S.ar=(video.videoWidth&&video.videoHeight)?video.videoWidth/video.videoHeight:16/9;
  ['#play','#b10','#b1','#f1','#f10','#scrub'].forEach(s=>$(s).disabled=false);
  video.playbackRate=+$('#rate').value; video.currentTime=0;
  layout(); updateReadout(); updateResult();
});
video.addEventListener('error',()=>{const w=$('#vidErr');w.hidden=false;w.textContent='이 영상은 브라우저에서 재생할 수 없습니다. 아이폰은 설정 > 카메라 > 포맷에서 "높은 호환성"으로 찍어 보세요.';});
video.addEventListener('timeupdate',updateReadout);
video.addEventListener('seeked',updateReadout);
video.addEventListener('play',()=>$('#play').textContent='정지');
video.addEventListener('pause',()=>{$('#play').textContent='재생';updateReadout();});
$('#play').addEventListener('click',()=>{
  if(S.exporting)return;
  if(video.paused){if(S.points.length>=2&&video.currentTime>=S.points[S.points.length-1].t-1e-6)video.currentTime=Math.max(0,S.points[0].t-0.25*S.slow);video.playbackRate=+$('#rate').value;video.play();}
  else video.pause();
});
function seekBy(n){if(S.exporting||!S.hasVideo)return;video.pause();video.currentTime=Math.min(video.duration||0,Math.max(0,video.currentTime+n*step()));}
// 길게 누르면 연속 이동
function holdRepeat(btn,n){
  let t1=null,t2=null; const stop=()=>{clearTimeout(t1);clearInterval(t2);t1=t2=null;};
  btn.addEventListener('pointerdown',e=>{if(btn.disabled)return;e.preventDefault();seekBy(n);t1=setTimeout(()=>{t2=setInterval(()=>seekBy(n),Math.abs(n)>1?140:60);},380);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener('click',e=>{if(e.detail===0)seekBy(n);});
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
holdRepeat($('#b10'),-10);holdRepeat($('#b1'),-1);holdRepeat($('#f1'),1);holdRepeat($('#f10'),10);
$('#scrub').addEventListener('input',e=>{if(S.exporting)return;video.pause();video.currentTime=Math.min(video.duration||0,+e.target.value*step());});
$('#rate').addEventListener('change',()=>{video.playbackRate=+$('#rate').value;});
document.addEventListener('keydown',e=>{
  if(!S.hasVideo||S.exporting||e.target.matches('input,select,textarea'))return;
  if(e.key==='ArrowRight'){seekBy(e.shiftKey?10:1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){seekBy(e.shiftKey?-10:-1);e.preventDefault();}
  else if(e.key===' '){$('#play').click();e.preventDefault();}
});

/* ---------- 점 찍기: 누르면 찍히고, 누른 채 움직이면 확대경으로 조정 ---------- */
let dragT=null;
const posOf=e=>{const r=cv.getBoundingClientRect();return{x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))};};
cv.addEventListener('pointerdown',e=>{
  if(S.exporting)return;
  if(!S.hasVideo){$('#file').click();return;}
  if(!video.paused){video.pause();return;}
  e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const {x,y}=posOf(e), t=video.currentTime, i=hereIdx();
  if(i>=0){S.points[i].x=x;S.points[i].y=y;dragT=S.points[i].t;}
  else{S.points.push({t,x,y});S.points.sort((a,b)=>a.t-b.t);dragT=t;}
  loupe={x,y}; updateResult();
});
cv.addEventListener('pointermove',e=>{
  if(dragT===null)return; e.preventDefault();
  const {x,y}=posOf(e), p=S.points.find(q=>q.t===dragT); if(p){p.x=x;p.y=y;} loupe={x,y};
});
const endDrag=()=>{if(dragT===null)return;dragT=null;loupe=null;updateResult();};
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
$('#delHere').onclick=()=>{const i=hereIdx();if(i>=0){S.points.splice(i,1);updateResult();}};
$('#clear').onclick=()=>{const b=$('#clear');
  if(b.dataset.armed){delete b.dataset.armed;b.textContent='점 모두 지우기';S.points=[];updateResult();}
  else{b.dataset.armed='1';b.textContent='한 번 더 누르면 삭제';setTimeout(()=>{if(b.dataset.armed){delete b.dataset.armed;b.textContent='점 모두 지우기';}},3000);}
};

/* ---------- 저장·설정 ---------- */
$('#export').onclick=()=>{$('#result').hidden=true;(canWC()?exportVideoWC():exportVideo()).catch(()=>{S.exporting=false;setBusy(false);status('영상을 만들지 못했습니다. 다시 시도해 주세요.');});};
function bindNum(id,key){$(id).addEventListener('input',()=>{const v=parseFloat($(id).value);if(!isNaN(v)){S[key]=v;persist();updateResult();updateReadout();}});}
bindNum('#dist','dist');bindNum('#ext','ext');
$('#fps').addEventListener('change',()=>{S.fps=+$('#fps').value;persist();updateResult();updateReadout();});
$('#slow').addEventListener('change',()=>{S.slow=+$('#slow').value;persist();updateResult();updateReadout();});
$('#hand').addEventListener('change',()=>{S.hand=$('#hand').value;persist();});
$('#exMode').addEventListener('change',()=>{S.exMode=$('#exMode').value;persist();});

layout(); updateResult(); requestAnimationFrame(render);
})();
</script>
</body>
</html>
